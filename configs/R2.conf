configure
set system host-name R2
set interfaces ethernet eth0 address 10.29.0.2/30
set interfaces ethernet eth1 address 10.29.0.5/30
set interfaces loopback lo address 10.29.0.202/32
set protocols isis net 49.0029.0000.0000.0002.00
set protocols isis level level-2
set protocols isis metric-style wide
set protocols isis interface eth0 network point-to-point
set protocols isis interface eth1 network point-to-point
set protocols isis interface lo passive
commit
save
exit
